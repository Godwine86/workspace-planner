name: Keep Supabase awake

# Supabase's free plan pauses a project after about a week with no requests,
# which makes sign-in fail with "Failed to fetch". This makes one small read
# every 3 days so the project never counts as inactive.
on:
  schedule:
    - cron: '17 5 */3 * *'   # 05:17 UTC every 3rd day
  workflow_dispatch:          # "Run workflow" button for a manual check

permissions:
  actions: write   # only for the re-enable step below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://mgslbnvymigzsqofztco.supabase.co
      # Publishable key: designed to be public (it already ships in the site's
      # JavaScript); row-level security controls what it can read.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_KaDi5pkbYN4w4gaxLVRkrw_xwgFyt5s
    steps:
      - name: Query the database
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          # Fail loudly (GitHub emails the repo owner) if the project is paused or unreachable
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat response.txt
            echo "::error::Supabase did not respond normally (HTTP $status). The project may be paused: restore it in the Supabase dashboard."
            exit 1
          fi

      # GitHub disables schedules in public repos after 60 days without repository
      # activity; re-enabling the workflow on each run keeps this one switched on.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
